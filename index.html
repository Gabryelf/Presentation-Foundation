<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation-Foundation v3.0 — Конструктор презентаций</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        <header id="app-header"></header>
        <main id="app-main">
            <!-- Главный экран -->
            <section id="main-screen" class="main-screen">
                <div class="container">
                    <div class="welcome-section">
                        <h1>✨ Создайте презентацию</h1>
                        <p class="subtitle">Загрузите данные, настройте стиль и получите профессиональную презентацию</p>
                        
                        <!-- Компактная панель управления -->
                        <div class="control-panel">
                            <!-- Шаблоны -->
                            <div class="panel-section templates-section">
                                <div class="section-header">
                                    <span class="section-icon">🎨</span>
                                    <h3>Шаблон</h3>
                                </div>
                                <div class="templates-grid" id="templates-grid"></div>
                            </div>

                            <!-- Контент -->
                            <div class="panel-section content-section">
                                <div class="section-header">
                                    <span class="section-icon">📄</span>
                                    <h3>Контент</h3>
                                </div>
                                <div class="content-tabs">
                                    <button class="content-tab active" data-tab="upload">📤 Загрузить</button>
                                    <button class="content-tab" data-tab="input">✏️ Ввести</button>
                                </div>
                                <div class="content-area">
                                    <div class="content-panel active" id="panel-upload">
                                        <div class="upload-area" id="upload-area">
                                            <span class="upload-icon">📄</span>
                                            <p>Перетащите файл или <span class="upload-link">выберите</span></p>
                                            <span class="upload-hint">.txt, .md, .json</span>
                                            <input type="file" id="file-input" accept=".txt,.md,.json" style="display:none">
                                            <div class="upload-file-info" id="upload-file-info">
                                                <span class="file-name"></span>
                                                <span class="file-size"></span>
                                                <button class="file-remove">×</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="content-panel" id="panel-input">
                                        <input type="text" id="presentation-title" placeholder="Название презентации" class="input-field">
                                        <textarea id="slides-input" rows="3" placeholder="Введите слайды (каждый с новой строки)&#10;Введение&#10;Основная часть&#10;- Пункт 1&#10;- Пункт 2" class="input-field"></textarea>
                                    </div>
                                </div>
                                <button id="apply-data-btn" class="btn-primary btn-sm">Применить</button>
                            </div>

                            <!-- Стиль -->
                            <div class="panel-section style-section">
                                <div class="section-header">
                                    <span class="section-icon">🎨</span>
                                    <h3>Стиль</h3>
                                </div>
                                <div id="style-editor-container"></div>
                            </div>

                            <!-- Изображения -->
                            <div class="panel-section images-section">
                                <div class="section-header">
                                    <span class="section-icon">🖼️</span>
                                    <h3>Изображения</h3>
                                </div>
                                <button class="image-upload-btn" id="image-upload-btn">📤 Добавить</button>
                                <input type="file" id="image-input" accept="image/*" multiple style="display:none">
                                <div class="image-grid" id="image-grid"></div>
                            </div>
                        </div>

                        <button id="generate-btn" class="btn-generate">
                            🚀 Сгенерировать презентацию
                        </button>
                    </div>
                </div>
            </section>

            <!-- Режим презентации -->
            <section id="presentation-mode" class="presentation-mode" style="display:none;">
                <div class="presentation-container">
                    <!-- Минималистичные контролы -->
                    <div class="presentation-controls" id="presentation-controls">
                        <button id="back-to-main" class="ctrl-btn" title="Назад">←</button>
                        <div class="ctrl-divider"></div>
                        <div class="slide-counter">
                            <span id="current-slide-num">1</span>
                            <span> / </span>
                            <span id="total-slides">1</span>
                        </div>
                        <div class="ctrl-divider"></div>
                        <div class="ctrl-group">
                            <button id="prev-slide" class="ctrl-btn" title="Предыдущий">◀</button>
                            <button id="next-slide" class="ctrl-btn" title="Следующий">▶</button>
                        </div>
                        <div class="ctrl-divider"></div>
                        <div class="ctrl-group">
                            <button id="zoom-out" class="ctrl-btn" title="Уменьшить">−</button>
                            <span id="zoom-level">100%</span>
                            <button id="zoom-in" class="ctrl-btn" title="Увеличить">+</button>
                        </div>
                        <div class="ctrl-divider"></div>
                        <button id="fullscreen-btn" class="ctrl-btn" title="На весь экран">⛶</button>
                        <button id="export-btn" class="ctrl-btn primary" title="Скачать">⬇ Скачать</button>
                    </div>

                    <!-- Слайды -->
                    <div class="slides-viewport" id="slides-viewport">
                        <div class="slides-wrapper" id="slides-wrapper">
                            <div class="slides-container" id="slides-container"></div>
                        </div>
                    </div>

                    <!-- Прогресс -->
                    <div class="progress-indicators" id="progress-indicators"></div>
                </div>
            </section>
        </main>
        <footer id="app-footer"></footer>
    </div>
    <script type="module" src="src/core/App.js"></script>
</body>
</html>
