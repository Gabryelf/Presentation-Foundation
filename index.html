<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation-Foundation v2.0 — Конструктор презентаций</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header id="app-header"></header>
        
        <main id="app-main">
            <!-- Главный экран -->
            <section id="main-screen" class="main-screen">
                <div class="container">
                    <div class="welcome-section">
                        <h1>✨ Создайте презентацию</h1>
                        <p class="subtitle">Загрузите данные, выберите шаблон и получите стильную презентацию</p>
                        
                        <div class="upload-area" id="upload-area">
                            <div class="upload-content">
                                <span class="upload-icon">📄</span>
                                <h3>Загрузите файл</h3>
                                <p>Поддерживаются: .txt, .md, .json</p>
                                <button class="btn-primary" id="upload-btn">Выбрать файл</button>
                                <input type="file" id="file-input" accept=".txt,.md,.json" style="display:none">
                            </div>
                        </div>
                        
                        <div id="templates-section" class="templates-section">
                            <h2>Выберите шаблон</h2>
                            <div class="templates-grid" id="templates-grid"></div>
                        </div>
                        
                        <button id="generate-btn" class="btn-primary btn-large" style="display:none;">
                            🚀 Сгенерировать презентацию
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- Режим презентации -->
            <section id="presentation-mode" class="presentation-mode" style="display:none;">
                <div class="presentation-container">
                    <!-- Управление -->
                    <div class="presentation-controls">
                        <button id="back-to-main" class="btn-secondary">← Назад</button>
                        <div class="slide-counter">
                            <span id="current-slide-num">1</span>
                            <span> / </span>
                            <span id="total-slides">1</span>
                        </div>
                        <div class="control-buttons">
                            <button id="prev-slide" class="btn-icon">◀</button>
                            <button id="next-slide" class="btn-icon">▶</button>
                        </div>
                        <button id="export-btn" class="btn-primary">💾 Скачать</button>
                    </div>
                    
                    <!-- Слайды -->
                    <div class="slides-viewport">
                        <div class="slides-container" id="slides-container">
                            <!-- Слайды будут рендериться здесь -->
                        </div>
                    </div>
                    
                    <!-- Индикаторы прогресса -->
                    <div class="progress-indicators" id="progress-indicators"></div>
                </div>
            </section>
        </main>
        
        <footer id="app-footer"></footer>
    </div>

    <script type="module" src="src/core/App.js"></script>
</body>
</html>
